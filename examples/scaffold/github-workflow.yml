# Copy to .github/workflows/ci.yml. Lint and test on every push/PR; build the image on main and tags.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-24.04
    env:
      # mongo 8.x exits when uname reports 6.19-7.0.13 (SERVER-121912).
      # ubuntu-24.04 reports 7.0.0 for a kernel that already has the fix.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.3
      - name: Test
        run: gotestsum --format=testname -- -race -tags=integration_test ./...
      - name: Mocks are up to date
        run: go tool mockery && git diff --exit-code

  docker:
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || { echo "::error::Bump VERSION and commit it before tagging"; exit 1; }
      - name: Build image
        run: docker build --build-arg COMMIT=${{ github.sha }} --build-arg BRANCH=${{ github.ref_name }} -t <org>/<svc>:${{ github.ref_name }} .
      # Add your registry login and `docker push` here.
